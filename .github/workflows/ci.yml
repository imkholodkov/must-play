name: CI

on:
  push:
  pull_request:

permissions:
  contents: write # публикация отчёта Allure в ветку gh-pages

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mustplay
          POSTGRES_PASSWORD: mustplay
          POSTGRES_DB: mustplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mustplay"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mustplay:mustplay@localhost:5432/mustplay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Линтинг
        run: |
          ruff check .
          ruff format --check .
      - name: Тесты с покрытием
        run: pytest --alluredir allure-results --cov-report=html --cov-report=json

      # Отчёт Allure публикуется на GitHub Pages только для main, даже если тесты упали
      - name: История прошлых отчётов
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/setup-java@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          distribution: temurin
          java-version: "17"
      - name: Сборка отчёта Allure
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -sSL https://github.com/allure-framework/allure2/releases/download/2.38.1/allure-2.38.1.tgz | tar -xz
          # история прошлых прогонов даёт в отчёте графики трендов
          mkdir -p allure-results/history
          cp -r gh-pages/history/. allure-results/history/ 2>/dev/null || true
          # блок Environment на главной странице отчёта: покрытие и ссылка на отчёт по файлам
          COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 2))" 2>/dev/null || echo "n/a")
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          {
            echo "Coverage=${COVERAGE}%"
            echo "Coverage.report=${PAGES_URL}/coverage/"
            echo "Python=$(python --version | cut -d' ' -f2)"
            echo "Commit=${GITHUB_SHA::7}"
          } > allure-results/environment.properties
          ./allure-2.38.1/bin/allure generate allure-results -o allure-history --clean
          if [ -d htmlcov ]; then cp -r htmlcov allure-history/coverage; fi
      - name: Публикация на GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
