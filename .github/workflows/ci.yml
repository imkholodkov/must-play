name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mustplay
          POSTGRES_PASSWORD: mustplay
          POSTGRES_DB: mustplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mustplay"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mustplay:mustplay@localhost:5432/mustplay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Линтинг
        run: |
          ruff check .
          ruff format --check .
      - name: Тесты с покрытием
        run: pytest
