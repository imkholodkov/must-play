name: CI

on:
  push:
  pull_request:

permissions:
  contents: write # публикация отчёта Allure в ветку gh-pages

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mustplay
          POSTGRES_PASSWORD: mustplay
          POSTGRES_DB: mustplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mustplay"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mustplay:mustplay@localhost:5432/mustplay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Линтинг
        run: |
          ruff check .
          ruff format --check .
      - name: Тесты с покрытием
        run: pytest --alluredir allure-results

      # Отчёт Allure публикуется на GitHub Pages только для main, даже если тесты упали
      - name: История прошлых отчётов
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Сборка отчёта Allure
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20
      - name: Публикация на GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
